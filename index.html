<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qanvas Tracker</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#061523" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   [บล็อก 2] สไตล์ (CSS) — โทนสว่างแบบเว็บ AI สากล
   แก้สีทั้งหมดได้ที่ :root ด้านล่าง
   ═══════════════════════════════════════════════════════════ */
/* ═══ BRAND TOKENS — matched to qanvasadvisory.com ═══
   Light palette lives on :root so the page is fully styled even with JS off.
   Dark palette is applied via prefers-color-scheme below (device setting). */
:root{
  color-scheme: only light;
  --bg:#F1F5F8; --bg-grad:radial-gradient(1200px 620px at 78% -12%, #E4EFF5 0%, #EDF3F7 48%, #F1F5F8 100%);
  --panel:#FFFFFF; --line:rgba(10,37,64,.10); --line2:rgba(10,37,64,.18);
  /* navy = ตัวอักษรหัวเรื่อง (สลับเป็นสีสว่างในโหมดมืด) */
  --navy:#0A2540; --navy2:#0E2E4E;
  --ink:#0A2540; --ink2:#3F5A72; --ink3:#7C93A6;
  --teal:#00A8B5; --teal-d:#00707A; --teal-bg:#E0F5F7; --teal-grad:linear-gradient(120deg,#00A8B5,#3DD5E8);
  --sky:#E1F4FA; --sky-d:#00707A; --sky-accent:#3DD5E8;
  --red:#DC3D42; --red-bg:#FBE9E9; --red-fg:#B4292E;
  --amber:#CF850A; --amber-bg:#FBEFDA; --amber-fg:#8F5A08;
  --green:#248A57; --green-bg:#DFF2E8; --green-fg:#1B6B44;
  --purple:#7F77DD; --purple-bg:#EEEDFE; --purple-fg:#534AB7;
  --gray-bg:#E7EDF2;
  /* surfaces ที่เคย hardcode ไว้ในโค้ด — ย้ายมาเป็นโทเคนเพื่อให้สลับโหมดได้ทีเดียว */
  --track:#D7E1E9; --thead-bg:#ECF2F6; --grp-bg:#F6F9FB; --grp-bg-h:#EDF3F8;
  --row-hover:#F8FBFC; --detail-bg:#F2F9FB; --topbar-bg:rgba(241,245,248,.86);
  --bar-people:#0A2540; --bar-status-idle:#5B7386;
  --st-tl-bg:#EDF1F5; --st-tl-fg:#546C81; --st-tl-line:#D6DEE7;
  --shadow-sm:0 1px 2px rgba(10,37,64,.06);
  --shadow:0 1px 3px rgba(10,37,64,.07),0 6px 20px rgba(10,37,64,.09);
  --shadow-lg:0 6px 16px rgba(10,37,64,.1),0 20px 48px rgba(10,37,64,.15);
  --shadow-teal:0 4px 16px rgba(0,168,181,.32);
  --radius:13px;
  /* motion tokens (อ้างอิง Linear — โค้ง cubic ให้รู้สึก "สปริง" นุ่ม) */
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --dur:.22s; --dur-slow:.4s;
}
/* ═══ DARK — follows the device setting, no toggle needed ═══
   Only token VALUES change here; every rule below keeps using the same names. */
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: only dark;
    --bg:#061523; --bg-grad:radial-gradient(1200px 620px at 78% -12%, #0C2740 0%, #081E30 48%, #061523 100%);
    --panel:#0C2740; --line:rgba(61,213,232,.14); --line2:rgba(61,213,232,.26);
    --navy:#EAF3F7; --navy2:#C8DCE7;
    --ink:#EAF3F7; --ink2:#9FB6C6; --ink3:#5E7789;
    --teal:#00A8B5; --teal-d:#3DD5E8; --teal-bg:#0E3B4A; --teal-grad:linear-gradient(120deg,#00A8B5,#3DD5E8);
    --sky:#0E3B4A; --sky-d:#3DD5E8;
    --red:#FF7B7E; --red-bg:#3E1A1D; --red-fg:#FF8A8D;
    --amber:#F3B94F; --amber-bg:#3A2A10; --amber-fg:#F3B94F;
    --green:#3FB77E; --green-bg:#0F3324; --green-fg:#55CE96;
    --purple:#9E96E6; --purple-bg:#241F4A; --purple-fg:#AFA9EC;
    --gray-bg:#17384F;
    --track:#113252; --thead-bg:#081E30; --grp-bg:#113252; --grp-bg-h:#16405F;
    --row-hover:#0F2E4A; --detail-bg:#0F2E4A; --topbar-bg:rgba(6,21,35,.86);
    --bar-people:#3DD5E8; --bar-status-idle:#7A93A8;
    --st-tl-bg:#17384F; --st-tl-fg:#9FB6C6; --st-tl-line:rgba(61,213,232,.22);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 3px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.45);
    --shadow-lg:0 6px 16px rgba(0,0,0,.4),0 20px 48px rgba(0,0,0,.55);
    --shadow-teal:0 4px 16px rgba(0,168,181,.4);
  }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;font-family:'Inter','Prompt',system-ui,sans-serif;color:var(--ink);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* หัวเรื่องใช้ Sora เหมือนเว็บบริษัท · ตัวเลขเด่นใช้ Sora เช่นกัน */
.brand .bt,.dash-h,.cust-name,.cal-title,.cv-bar-t,.modal-head h3{font-family:'Sora','Prompt',sans-serif;letter-spacing:-.015em}
.focus-n{font-family:'Sora',sans-serif}
/* การตัดคำ: ไทยไม่มีช่องว่างระหว่างคำ — ห้าม break-all (จะหั่นกลางคำ)
   break-word ตัดเฉพาะสายอักขระยาวที่ไม่มีจุดตัด เช่น ลิงก์/ชื่อไฟล์ */
.task-cell,.card-task,.tl-task,.detail-val,.cal-task-t,.cv-atext,.bar-empty{overflow-wrap:break-word;word-break:normal}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none !important}

/* ---- layout ---- */
.app{max-width:1180px;margin:0 auto;padding:0 18px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0;position:sticky;top:0;background:var(--bg);z-index:20}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;object-fit:contain;display:block;flex-shrink:0}
.brand .bt{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand .bs{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.topright{display:flex;align-items:center;gap:10px}
.sync-chip{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.help-btn{width:28px;height:28px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line2);color:var(--ink2);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all var(--dur) var(--ease)}
.help-btn:hover{border-color:var(--teal);color:var(--teal-d);transform:scale(1.08)}
.help-section{margin-bottom:16px}
.help-section h4{font-size:13px;font-weight:700;color:var(--teal-d);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.help-section p{font-size:12.5px;color:var(--ink2);line-height:1.6;margin-bottom:3px}
.help-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.help-tbl th{text-align:left;padding:5px 8px;background:var(--bg);color:var(--ink3);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line)}
.help-tbl td{padding:5px 8px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.help-tbl td b{color:var(--ink)}
.help-tbl .mono-s{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal-d)}
.help-tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:4px;margin-right:4px}
.lang-tog{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.lang-tog button{padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.lang-tog button.on{background:var(--teal);color:#fff}

/* ---- nav tabs ---- */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{padding:10px 16px;font-size:14px;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.tab.on{color:var(--teal-d);border-color:var(--teal);font-weight:600}
.tab:hover:not(.on){color:var(--ink)}

/* ---- toolbar / filters ---- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sel{position:relative}
.sel select{appearance:none;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 28px 8px 11px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:inherit}
.sel select:focus{outline:2px solid var(--teal-bg);border-color:var(--teal)}
.sel.active select{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d);font-weight:600}
.sel::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink3);pointer-events:none}
.search{flex:1;min-width:150px;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 12px}
.search input{border:none;outline:none;flex:1;font-size:13.5px;font-family:inherit;color:var(--ink);background:none}
.search svg{flex-shrink:0}
.viewtog{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.viewtog button{padding:8px 11px;font-size:13.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.viewtog button.on{background:var(--teal);color:#fff}
.btn-primary{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:8px}
.btn-primary:hover{background:var(--teal-d)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);color:var(--ink2);font-size:13.5px;font-weight:500;padding:8px 12px;border-radius:8px}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-d)}
.btn-ghost.on-done{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-d);font-weight:600}

/* ---- chips ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;min-height:1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--teal-bg);color:var(--teal-d);padding:4px 10px;border-radius:14px;font-weight:500}
.chip button{color:var(--teal-d);opacity:.6;font-size:13.5px;line-height:1}
.chip button:hover{opacity:1}
.chip-clear{background:var(--gray-bg);color:var(--ink2)}

/* ---- table ---- */
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;padding:10px 13px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
tbody td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--row-hover)}
.grp-row td{background:var(--grp-bg);font-weight:600;font-size:12.5px;color:var(--ink);cursor:pointer;user-select:none}
.grp-row td:hover{background:var(--grp-bg-h)}
.grp-caret{display:inline-block;width:14px;color:var(--ink3);transition:transform .15s}
.grp-row.collapsed .grp-caret{transform:rotate(-90deg)}
/* คลิกแถวงานเพื่อดู Next Step */
.task-row{cursor:pointer}
.task-row.open td{background:var(--detail-bg)}
.row-caret{display:inline-block;width:13px;margin-right:2px;color:var(--ink3);font-size:10px;transition:transform .15s}
.task-row.open .row-caret{transform:rotate(90deg);color:var(--teal)}
.detail-row td{background:var(--detail-bg);border-top:none;padding-top:0}
.detail-box{display:flex;gap:10px;align-items:baseline;padding:2px 0 8px 30px;font-size:12.5px;line-height:1.5}
.detail-lbl{color:var(--teal);font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0}
.detail-val{color:var(--ink2)}
.detail-val.none{color:var(--ink3)}
.grp-count{color:var(--ink3);font-weight:500;font-size:11.5px;margin-left:6px}

.rag{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;white-space:nowrap}
.rag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rag-red{color:var(--red-fg)}.rag-red .rag-dot{background:var(--red)}
.rag-amber{color:var(--amber-fg)}.rag-amber .rag-dot{background:var(--amber)}
.rag-green{color:var(--green-fg)}.rag-green .rag-dot{background:var(--green)}
.rag-none{color:var(--ink3)}.rag-none .rag-dot{background:var(--ink3)}

.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;font-weight:500;white-space:nowrap}
.st-notstarted{background:var(--gray-bg);color:var(--ink2)}
.st-inprogress{background:var(--sky);color:var(--sky-d)}
.st-waiting{background:var(--amber-bg);color:var(--amber-fg)}
.st-blocked{background:var(--purple-bg);color:var(--purple-fg)}
.st-done{background:var(--green-bg);color:var(--green-fg)}
.st-dropped{background:var(--gray-bg);color:var(--ink3)}
.st-timeline{background:var(--st-tl-bg);color:var(--st-tl-fg);border:1px solid var(--st-tl-line)}
.pri{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;padding:2px 7px;border-radius:5px}
.pri-P1{background:var(--red-bg);color:var(--red-fg)}
.pri-P2{background:var(--gray-bg);color:var(--ink2)}
.pri-P3{background:var(--gray-bg);color:var(--ink3)}
.dl{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink)}
.dl-soon{color:var(--red);font-weight:600}
.tf-tag{font-size:11.5px;color:var(--ink2);background:var(--gray-bg);padding:2px 7px;border-radius:5px}
.task-cell{font-weight:500;color:var(--ink);max-width:260px}
.warn-cell{background:var(--amber-bg) !important;position:relative}

/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-left:3px solid var(--line2)}
.card.rl-red{border-left-color:var(--red)}.card.rl-amber{border-left-color:var(--amber)}.card.rl-green{border-left-color:var(--green)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:9px}
.card-task{font-size:14px;font-weight:600;color:var(--ink)}
.card-meta{font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* ---- dashboard ---- */
.dash-h{font-size:17px;font-weight:700;margin-bottom:3px;letter-spacing:-.01em}
.dash-sub{font-size:13.5px;color:var(--ink2);margin-bottom:18px}
.focus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.focus-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);border-left:3px solid}
.focus-card.red{border-left-color:var(--red)}
.focus-card.amber{border-left-color:var(--amber)}
.focus-card.purple{border-left-color:var(--purple)}
.focus-card.teal{border-left-color:var(--teal)}
.focus-n{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600;line-height:1;color:var(--ink)}
.focus-l{font-size:12.5px;color:var(--ink2);margin-top:7px;line-height:1.35}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.panel h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--teal-d);font-weight:600;margin-bottom:13px}
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:10px;font-size:13.5px}
.bar-label{min-width:118px;max-width:118px;color:var(--ink2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-empty{color:var(--ink3);font-size:13px;padding:6px 0}
.bar-track{flex:1;height:18px;background:var(--track);border-radius:5px;overflow:hidden;min-width:0}
.bar-fill{height:100%;border-radius:5px;min-width:4px;display:block}
.bar-n{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink);min-width:22px;text-align:right;font-weight:500}

/* ---- drill-down (คลิกตัวเลข/แท่งกราฟ → เปิดงานที่กรองแล้ว) ---- */
.drill{cursor:pointer}
.drill:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.bar-row.drill{border-radius:8px;padding:2px 4px;margin-left:-4px;margin-right:-4px}
.bar-row.drill:hover{background:var(--teal-bg)}
.bar-row.drill:hover .bar-label{color:var(--teal-d)}
.focus-card.drill::after{content:'→';position:absolute;right:14px;top:13px;font-size:13px;color:var(--ink3);opacity:0;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
.focus-card.drill{position:relative}
.focus-card.drill:hover::after{opacity:1;transform:translateX(3px)}
.mini-drill,.grp-jump{font-size:11.5px;font-weight:600;color:var(--teal-d);background:var(--teal-bg);border:none;border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.mini-drill{margin-top:9px}
.grp-jump{margin-left:10px;opacity:0;transition:opacity var(--dur) var(--ease)}
.grp-row:hover .grp-jump,.grp-jump:focus-visible{opacity:1}
.mini-drill:hover,.grp-jump:hover{background:var(--teal);color:#fff}

/* ---- calendar ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-size:15px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:600;padding:6px 0}
.cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:82px;padding:7px 8px}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.cal-date{font-size:12.5px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.cal-cell.today .cal-date{color:var(--teal-d)}
.cal-ev{font-size:12.5px;padding:3px 6px;border-radius:5px;margin-bottom:3px;background:var(--teal-bg);color:var(--teal-d);line-height:1.3;cursor:default}
.cal-ev.red{background:var(--red-bg);color:var(--red-fg)}
.cal-ev.meeting{background:var(--purple-bg);color:var(--purple-fg)}
.cal-cell:not(.empty){cursor:pointer}
.cal-cell:not(.empty):hover{border-color:var(--teal)}
.cal-cell.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.cal-hint{font-size:12px;color:var(--ink3);margin-top:12px}
.cal-detail{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.cal-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-detail-date{font-size:14px;font-weight:600;color:var(--navy)}
.cal-detail-close{cursor:pointer;color:var(--ink3);font-size:16px;line-height:1;border:none;background:none}
.cal-task{padding:12px 0;border-top:1px solid var(--line)}
.cal-task:first-child{border-top:none;padding-top:0}
.cal-task-t{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
.cal-kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.cal-kv .k{color:var(--ink2)}
.cal-kv .v{color:var(--ink)}

/* ---- customer timeline ---- */
.cust-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:430px){
  .cust-tools{width:100%}
  .cust-tools .sel,.cust-tools .sel select{width:100%}
  .tl-item{grid-template-columns:64px 1fr;gap:8px}
  .tl-item .pill{grid-column:2;justify-self:start;margin-top:4px}
}
.cust-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.cust-name{font-size:17px;font-weight:700}
.deal-block{margin-bottom:8px}
.deal-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;margin-bottom:2px;padding:10px 0 4px}
.deal-title .dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}
.tl-item{display:grid;grid-template-columns:76px 1fr auto;align-items:start;gap:14px;padding:9px 0 9px 16px;margin-left:5px;border-left:2px solid var(--line2);position:relative;font-size:13.5px}
.tl-item::before{content:'';position:absolute;left:-5px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--ink3);border:2px solid var(--panel)}
.tl-item.red::before{background:var(--red)}
.tl-item.amber::before{background:var(--amber)}
.tl-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2);padding-top:2px}
.tl-mid{min-width:0}
.tl-task{color:var(--ink);line-height:1.4}
.tl-next{font-size:11.5px;color:var(--ink2);margin-top:3px;display:flex;align-items:baseline;gap:5px}
.tl-next b{color:var(--teal);font-weight:600;font-size:10px;letter-spacing:.03em;text-transform:uppercase;flex-shrink:0}
.tl-next.empty{color:var(--ink3)}
.tl-item .pill{justify-self:end;margin-top:1px}
.tl-summary{background:var(--teal-bg);border-radius:var(--radius);padding:14px 16px;margin-top:14px}
.tl-empty{padding:20px 4px;color:var(--ink3);font-size:13.5px}
.tl-sum-t{font-size:13.5px;font-weight:600;color:var(--teal-d);margin-bottom:4px}
.tl-sum-s{font-size:12.5px;color:var(--ink2);margin-bottom:10px}

/* ---- summary modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(15,42,67,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(15,42,67,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.modal-head h3{font-size:14px;font-weight:600}
.modal-close{font-size:20px;color:var(--ink3);line-height:1}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px;margin:16px 18px 0}
.seg button{flex:1;padding:7px;font-size:12.5px;border-radius:6px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--teal);color:#fff;font-weight:600}
.summary-pre{margin:14px 18px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:14px;font-size:13.5px;line-height:1.9;white-space:pre-wrap;color:var(--ink);max-height:320px;overflow:auto}
.modal-foot{padding:0 18px 18px;display:flex;gap:8px}
.empty-note{text-align:center;color:var(--ink3);font-size:13.5px;padding:30px}

/* ---- responsive ---- */
@media(max-width:820px){
  .focus-grid{grid-template-columns:repeat(2,1fr)}
  .dash-cols{grid-template-columns:1fr}
  .cal-grid{font-size:11px}
  .cal-cell{min-height:60px}
}
/* ปุ่ม toggle กระชับ (show/hide completed & timeline) */
.tgl{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);color:var(--ink2);font-size:12px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap}
.tgl:hover{border-color:var(--teal);color:var(--teal-d)}
.tgl .tgl-box{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:transparent;transition:all .15s;flex-shrink:0}
.tgl.on{border-color:var(--teal);color:var(--teal-d);background:var(--teal-bg)}
.tgl.on .tgl-box{background:var(--teal);border-color:var(--teal);color:#fff}
.tgl-group{display:inline-flex;gap:8px;align-items:center}
@media(max-width:560px){
  .tabs{overflow-x:auto}
  .tbl-wrap{overflow-x:auto}
  table{min-width:640px}
}

/* ═══ MOTION — micro-interactions & transitions (อ้างอิง Linear/Stripe) ═══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}

/* หน้าเปลี่ยน → จางขึ้นนุ่ม */
.page:not(.hidden){animation:fadeUp var(--dur-slow) var(--ease-out)}
/* การ์ด/แถว/panel ทยอยโผล่ (stagger) */
.card{animation:fadeUp var(--dur-slow) var(--ease-out) backwards}
.card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.11s}
.card:nth-child(5){animation-delay:.14s}.card:nth-child(6){animation-delay:.17s}
.focus-card{animation:scaleIn var(--dur-slow) var(--ease-out) backwards}
.focus-card:nth-child(1){animation-delay:.04s}.focus-card:nth-child(2){animation-delay:.09s}
.focus-card:nth-child(3){animation-delay:.14s}.focus-card:nth-child(4){animation-delay:.19s}

/* transition ทั่วไป — ทุกอันที่กดได้ */
.tab,.sel select,.btn-primary,.btn-ghost,.viewtog button,.lang-tog button,
.chip,.card,.focus-card,.cal-ev,.tl-item,.grp-row td,.modal-close,.seg button{
  transition:all var(--dur) var(--ease)}

/* hover: ยกขึ้น + เงาเข้ม (รู้ว่ากดได้) */
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-left-width:4px}
.focus-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-teal)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-ghost:active,.viewtog button:active,.tab:active{transform:scale(.97)}
.cal-ev:hover{transform:translateX(2px);filter:brightness(.97)}
.tl-item:hover{background:var(--bg);border-radius:8px}
.chip:hover{transform:scale(1.04)}

/* focus cards + buttons ใช้ teal gradient */
.btn-primary{background:var(--teal-grad) !important;box-shadow:var(--shadow-sm)}

.tab.on,.lang-tog button.on,.viewtog button.on,.seg button.on{background:var(--teal-grad) !important}

/* bar วิ่งจาก 0 */

/* modal สไลด์ขึ้น + ฉากหลังจาง */
.modal-bg{animation:fadeIn var(--dur) ease}
.modal{animation:slideUp var(--dur-slow) var(--ease-out)}

/* underline นำทางแบบ Linear (ขีดล่างเลื่อนตาม) */
.tab{position:relative}
.tab.on::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--teal-grad);border-radius:2px;animation:fadeIn var(--dur) ease}

/* row hover ในตาราง = ไฮไลต์นุ่ม + ขยับ */
tbody tr{transition:background var(--dur) ease}


/* ═══ FIX รอบ 3: contrast เข้ม + สมดุล + มือถือ ═══ */
/* หัวข้อใหญ่เข้มคม */
.brand .bt{color:var(--navy);font-weight:700}
.dash-h,.cust-name,.cal-title{color:var(--navy)}
/* topbar มีเส้นล่างคม + พื้นเนียน */
.topbar{border-bottom:1px solid var(--line);backdrop-filter:blur(8px);background:var(--topbar-bg)}
/* tabs bar เข้มขึ้น */
.tabs{border-bottom:1.5px solid var(--line2)}
.tab{font-size:14px}
/* focus card: จัดกลางแนวตั้ง + สูงเท่ากัน + ตัวเลขเข้ม navy */
.focus-card{min-height:96px;display:flex;flex-direction:column;justify-content:center;border-left-width:4px}
.focus-n{color:var(--navy);font-size:32px}
.focus-l{font-size:12.5px}
/* bar เห็นชัด: track เข้มขึ้น + fill มี min-width + ตัวหนา */
.bar-track{background:var(--track);height:18px}
.bar-label{font-size:13px}
.bar-n{font-size:13px;font-weight:600}
/* วันในตาราง: สม่ำเสมอ — soon=แดงเข้ม ปกติ=navy (ไม่ดำจืด) */
.dl{color:var(--navy);font-weight:500}
/* panel หัวข้อเข้มคม */
.panel h3{color:var(--teal-d);font-size:12px;font-weight:700}
/* table header เข้ม อ่านชัด */
thead th{color:var(--ink2);font-size:11px;background:var(--thead-bg)}
.task-cell{font-size:14px}
tbody td{font-size:13.5px}
/* group row เข้ม */
.grp-row td{background:var(--grp-bg);font-size:13px;color:var(--navy)}

/* ═══ มือถือจริง (≤560): การ์ดแทนตาราง + ไม่อัด ═══ */
@media(max-width:560px){
  .app{padding:0 12px 50px}
  .topbar{flex-wrap:wrap;gap:8px}
  .toolbar{gap:6px}
  .toolbar .sel select{padding:9px 26px 9px 10px;font-size:12.5px}
  .search{order:10;min-width:100%}
  /* focus grid ยังเป็น 2 คอลัมน์แต่สูงพอ */
  .focus-grid{gap:9px}
  .focus-n{font-size:27px}
  /* ปุ่ม/ป้ายใหญ่พอแตะ */
  .btn-primary,.btn-ghost{padding:9px 13px;font-size:13px}
  .cal-cell{min-height:52px;padding:5px}
  .cal-ev{font-size:11px}
}




/* ---- calendar: กล่องรายละเอียดวัน v3.2 ---- */
.cal-empty{font-size:13px;color:var(--ink3);padding:10px 2px}
.cal-task.open{background:var(--detail-bg);border-radius:10px;padding:10px 12px;margin:0 -12px 10px}
.cal-toggle{cursor:pointer;display:flex;gap:7px;align-items:flex-start}
.cal-caret{color:var(--ink3);transition:transform var(--dur) var(--ease);flex-shrink:0;margin-top:1px}
.cal-task.open .cal-caret{transform:rotate(90deg)}
.cal-more{margin-top:8px}
.cal-task .detail-wrap{padding-left:0}
#calMine{margin-right:auto}

/* ---- This Week ---- */
.wk-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.wk-h{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--teal-d);display:flex;align-items:center;gap:8px}
.wk-n{background:var(--teal-bg);color:var(--teal-d);border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700}
.wk-note{font-size:12px;color:var(--ink3);margin-top:4px}
.wk-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);margin-top:8px}
.wk-row:first-of-type{margin-top:6px}
.wk-d{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink2);min-width:52px;flex-shrink:0;font-weight:600}
.wk-d.late{color:var(--red-fg)}
.wk-t{flex:1;min-width:0;font-size:13.5px;color:var(--ink);overflow-wrap:break-word;word-break:normal}
.wk-m{display:block;font-size:11.5px;color:var(--ink3)}
.wk-s{flex-shrink:0}
.wk-b{display:flex;gap:6px;flex-shrink:0}
@media(max-width:640px){
  .wk-row{flex-wrap:wrap}
  .wk-b{width:100%}
}

/* ═══ v3: แผงแก้ไข · ฟอร์ม · กล่องเตือน · toast ═══ */
.only-editor{display:none}
body.can-edit .only-editor{display:inline-flex}
.detail-wrap{padding:4px 0 12px 30px}
.detail-wrap.saving{opacity:.55;pointer-events:none}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-bottom:10px}
.d-f{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.d-f.d-wide{grid-column:1/-1}
.d-in{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;width:100%}
.d-in:focus{outline:2px solid var(--teal-bg);border-color:var(--teal)}
.d-chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);align-self:end;padding-bottom:7px}
.d-chk input{width:15px;height:15px;accent-color:var(--teal)}
.d-acts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.d-btn{font-size:12px;font-weight:600;color:var(--ink2);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap;transition:all var(--dur) var(--ease)}
.d-btn:hover{border-color:var(--teal);color:var(--teal-d)}
.d-btn.d-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.d-btn.d-primary:hover{background:var(--teal-d);color:#fff}
.d-foot{display:flex;gap:8px;flex-wrap:wrap}
/* ฟอร์ม */
.fm-body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fm-l{display:flex;flex-direction:column;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.fm-l.fm-wide,.fm-err,.fm-quick,.fm-task{grid-column:1/-1}
.fm-l input,.fm-l select,.fm-l textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;text-transform:none;letter-spacing:normal;font-weight:400}
.fm-l input:focus,.fm-l select:focus,.fm-l textarea:focus{outline:2px solid var(--teal-bg);border-color:var(--teal)}
.fm-hint{font-weight:400;text-transform:none;letter-spacing:normal;color:var(--ink3);font-size:11px}
.fm-err{color:var(--red-fg);font-size:12.5px;min-height:16px}
.fm-quick{display:flex;gap:7px}
.fm-task{font-size:14px;font-weight:500;color:var(--ink);background:var(--bg);border-radius:9px;padding:10px 12px}
/* กล่องเตือนงานเลยกำหนด */
.od-box{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.od-head{font-size:12.5px;font-weight:700;color:var(--red-fg);margin-bottom:8px}
.od-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.od-row:first-of-type{border-top:none}
.od-d{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--red-fg);font-weight:600;flex-shrink:0;min-width:44px}
.od-t{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow-wrap:break-word}
.od-m{display:block;font-size:11.5px;color:var(--ink3)}
.od-b{display:flex;gap:6px;flex-shrink:0}
.od-more{font-size:12px;color:var(--ink3);padding-top:7px}
/* toast + ปุ่ม Undo */
.qv-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:99;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;max-width:90vw}
[data-theme] .qv-toast,.qv-toast{background:#0A2540}
@media (prefers-color-scheme: dark){.qv-toast{background:#113252;border:1px solid var(--line2)}}
.qv-toast-a{background:none;border:none;color:var(--sky-accent);font-weight:700;font-size:13px;cursor:pointer;padding:0}
@media(max-width:560px){
  .fm-body{grid-template-columns:1fr}
  .detail-wrap{padding-left:8px}
  .od-row{flex-wrap:wrap}
  .od-b{width:100%}
}

/* ===== Client View (รายงานลูกค้า) =====
   ⚠️ ตั้งใจให้เป็นโหมดสว่างเสมอ ไม่ว่าเครื่องจะตั้งเป็นมืดหรือไม่
   เพราะเอกสารนี้ถูกส่งออกเป็น PNG/PDF ให้ลูกค้า — ต้องเป็นกระดาษขาวทุกครั้ง */
#cvReport{color-scheme:only light}
.cv-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.cv-bar-l{display:flex;align-items:center;gap:14px}
.cv-bar-t{font-size:18px;font-weight:800;color:var(--ink)}
.cv-bar-r{display:flex;gap:9px}
#cvReport{max-width:640px;margin:0 auto}
.cv-doc{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(10,31,51,.14)}
.cv-hero{background:linear-gradient(135deg,#071A2E 0%,#0A2540 55%,#0A4A57 100%);color:#fff;padding:32px 36px;position:relative;overflow:hidden}
.cv-hero::before{content:'';position:absolute;top:-60px;right:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(0,168,181,.18),transparent 70%)}
.cv-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(61,213,232,.5),transparent)}
.cv-htop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;position:relative;z-index:2}
.cv-hlogo{display:flex;align-items:center;gap:11px}
.cv-hlogo .q{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cv-hlogo .q img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(61,213,232,.4))}
.cv-hlogo .nm{font-size:17px;font-weight:700;letter-spacing:-.01em}
.cv-hbadge{text-align:right}
.cv-hbadge .bt{font-size:9px;color:#3DD5E8;letter-spacing:.14em;font-weight:600}
.cv-hbadge .bd{font-size:11px;color:#B8C7D6;margin-top:3px}
.cv-hclient{font-size:26px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:2}
.cv-hmeta{font-size:12px;color:#8CA3B8;margin-top:6px;position:relative;z-index:2;display:flex;gap:14px;align-items:center}
.cv-hdot{width:6px;height:6px;border-radius:50%;background:#1FB06A}
.cv-summary{display:flex;background:#F4F8FB;border-bottom:1px solid #E4ECF3}
.cv-sm{flex:1;padding:16px 18px;text-align:center;border-right:1px solid #E4ECF3}
.cv-sm:last-child{border:none}
.cv-sm-n{font-size:22px;font-weight:800;color:#0A2540}
.cv-sm-n.g{color:#1F9D5A}.cv-sm-n.a{color:#D89311}.cv-sm-n.b{color:#00A8B5}
.cv-sm-l{font-size:9.5px;color:#7C93A6;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.cv-deal{padding:22px 36px;border-bottom:1px solid #F0F4F8}
.cv-dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cv-dtitle{display:flex;align-items:center;gap:10px}
.cv-dtitle .ac{width:5px;height:22px;background:linear-gradient(180deg,#00A8B5,#3DD5E8);border-radius:3px}
.cv-dtitle .dn{font-size:16px;font-weight:800;color:#0A2540;letter-spacing:-.01em}
.cv-dstatus{display:flex;align-items:center;gap:11px}
.cv-ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cv-ring i{width:41px;height:41px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0A2540;font-style:normal}
.cv-tag{padding:5px 12px;border-radius:13px;font-size:10.5px;font-weight:700}
.cv-tag.g{background:#E3F5EB;color:#1F9D5A}.cv-tag.a{background:#FDF2DD;color:#B8860B}
.cv-act{display:flex;align-items:flex-start;gap:11px;padding:10px 14px;border-radius:10px;background:#F8FAFC;margin-bottom:7px}
.cv-aic{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
.cv-aic.done{background:#1F9D5A}.cv-aic.prog{background:#00A8B5}.cv-aic.next{background:#B0BAC6}.cv-aic.sched{background:#5B7CA8}
.cv-atext{flex:1;font-size:12.5px;color:#1B3A52;line-height:1.4}
.cv-astat{font-size:10px;margin-top:3px;font-weight:600}
.cv-astat.done{color:#1F9D5A}.cv-astat.prog{color:#00A8B5}.cv-astat.next{color:#8595A6}.cv-astat.sched{color:#5B7CA8}
.cv-await{margin:0 36px 22px;padding:16px 18px;background:linear-gradient(135deg,#FFFAF0,#FEF4DF);border:1.5px solid #F0DBA0;border-radius:12px;position:relative;overflow:hidden}
.cv-await::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#E8A317,#D89311)}
.cv-awh{font-size:11.5px;font-weight:800;color:#A87200;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.cv-awi{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px dashed #EAD5A0;font-size:12px;color:#5C4A18}
.cv-awi:last-child{border:none}
.cv-awi .an{font-weight:700;color:#8B6914;min-width:100px}
.cv-awi .ar{color:#C99A2E;font-weight:700}
.cv-foot{padding:18px 36px;background:#0A2540;color:#8CA3B8;text-align:center;font-size:11px;letter-spacing:.08em}
.cv-empty{text-align:center;padding:60px 20px;color:var(--ink3)}
</style>

<script>
/* ═══════════════════════════════════════════════════════════
   [บล็อก 1] ตั้งค่า (CONFIG)
   เชื่อม Google Sheet จริง: ใส่ URL CSV ที่ publish แล้ว
   ตอนนี้ว่าง = ใช้ข้อมูลเดโมฝังในแอป (บล็อก 4)
   ═══════════════════════════════════════════════════════════ */
const APP_VERSION = "v3.2 · 31 Jul 2026";
const CONFIG = {
  // ลิงก์แอปตัวจริง (ผ่าน Apps Script) — ใช้ตอนมีคนเผลอเปิดไฟล์หน้าตาตรง ๆ
  APP_URL: "https://script.google.com/macros/s/AKfycbyrvf2IkFCp0B2REONjztRpg9woUIlUognN27p2K-cZCZs4DxFATEm4TNzsJNCwshC_/exec",
  POLL_SECONDS: 45,   // ข้อมูลสดอยู่แล้ว ไม่ต้องถี่เท่าเดิม
  GUIDE_URL: "https://docs.google.com/spreadsheets/d/17UF94COeRiEmFR6_D-LdsZBP_DhzHHrPMZmMC93cij8/edit?gid=111634058",             // ← ใส่ลิงก์ Google Sheet ตรงนี้ (คนกด "เปิดชีต" เพื่อไปแก้ข้อมูล)
  TODAY: new Date().toISOString().slice(0,10)        // วันนี้ (เดโม) — ต่อชีตจริงใช้ new Date()
};

/* ═══ [บล็อก 4] ข้อมูลตัวอย่าง (22 เคสจากชีต v7) ═══ */
const DEMO_DATA = [];  // แอปใช้ข้อมูลจากชีตเท่านั้น

/* ═══ [บล็อก 5] เชื่อม Google Sheet (poll) ═══
   ถ้ามี CSV URL → ดึงจากชีต; ถ้าไม่มี → ใช้ DEMO_DATA */
let STATE = { rows: [], lang: 'en', page: 'table', view: 'table',
  filters: {division:'',client:'',deal:'',status:'',owner:'',search:'',rag:'',verify:'',activeOnly:false},
  me:{role:'viewer'}, calMineOnly:false, undo:null, dirtyLock:false, saving:{}, collapsed: {}, expanded: {}, calMonth: 6, calYear: 2026, custClient: '', sumRange: 'week', hideDone: false, hideTimeline: false, calSelDate: '', custHideDone: false, custHideTimeline: false, cvClient: '' };

/* ═══ ชั้นเชื่อมต่อ — คุยกับ Apps Script (แทน CSV เดิม) ═══
   เหตุผลที่เลิกใช้ CSV: ค้าง 5 นาที · เซลล์ที่มีการขึ้นบรรทัดใหม่ทำให้แถวแตก ·
   ไม่รู้เลขแถวจริงจึงเขียนกลับไม่ได้ */
const HAS_API = (typeof google!=='undefined' && google.script && google.script.run);
function api(fn, arg){
  return new Promise((resolve,reject)=>{
    if(!HAS_API){ reject(new Error('NO_API')); return; }
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e))))[fn](arg);
  });
}
function setSync(txt,cls){
  const el=document.getElementById('syncText'); if(el) el.textContent=txt;
  const dot=document.querySelector('.sync-dot'); if(dot) dot.style.background = cls==='bad' ? 'var(--red)' : (cls==='busy' ? 'var(--amber)' : 'var(--teal)');
}
async function loadData(silent){
  if(!HAS_API){ showOpenViaAppNotice(); return; }
  if(!silent) setSync('Loading…','busy');
  try{
    const res = await api('getRows');
    STATE.me = res.me || {role:'viewer'};
    STATE.rows = (res.rows||[]).map(mapRow);
    document.body.classList.toggle('can-edit', STATE.me.role==='editor');
    const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    setSync('Synced '+t+' · '+STATE.rows.length+' tasks'+(STATE.me.role==='editor'?'':' · view only'));
    render();
  }catch(e){
    setSync('⚠️ '+(e.message||'Cannot reach the sheet'),'bad');
    if(!STATE.rows.length) render();
  }
}
// แปลงหัวคอลัมน์ชีต → key ที่แอปใช้ · เก็บ _row (เลขแถวจริง) ไว้เขียนกลับ
function mapRow(o){
  const r={_row:o._row};
  for(const h in COLUMN_MAP) r[COLUMN_MAP[h]] = (o[h]!=null? String(o[h]).trim() : '');
  r.deadline=normDate(r.deadline); r.dateCompleted=normDate(r.dateCompleted);
  return r;
}
function showOpenViaAppNotice(){
  document.body.innerHTML='<div style="font-family:Inter,system-ui;max-width:520px;margin:14vh auto;text-align:center;padding:0 24px;color:var(--ink)">'+
    '<div style="font-size:19px;font-weight:600;margin-bottom:10px">Open the app from its own link</div>'+
    '<div style="font-size:14px;color:var(--ink2);line-height:1.7">This page is only the interface. Task data is served through the secure app link, which also signs you in with your Google account.</div>'+
    '<a href="'+CONFIG.APP_URL+'" target="_top" style="display:inline-block;margin-top:18px;background:var(--teal);color:#fff;padding:11px 20px;border-radius:9px;font-weight:600;font-size:14px;text-decoration:none">Open Qanvas Tracker →</a></div>';
}

// map หัวคอลัมน์ชีต → key ในแอป (ปรับได้ถ้าหัวชีตต่าง)
const COLUMN_MAP = {'Division':'division','Client':'client','Deal':'deal','Sub-Project':'subProject','Task':'task','Priority':'priority','Status':'status','Next Step':'nextStep','Owner':'owner','Counterparty':'counterparty','Deadline':'deadline','Timeframe':'timeframe','RAG':'rag','Date Completed':'dateCompleted','Verify?':'verify','Remarks':'remarks','Client-view':'clientView','Client-message':'clientMessage'};
function parseCSV(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const heads=splitCSVLine(lines[0]);
  return lines.slice(1).map(line=>{
    const cells=splitCSVLine(line); const o={};
    heads.forEach((h,i)=>{ const k=COLUMN_MAP[h.trim()]; if(k) o[k]=(cells[i]||'').trim(); });
    // แปลงวันที่จาก Google (M/D/YYYY) เป็น YYYY-MM-DD ที่แอปใช้
    o.deadline=normDate(o.deadline);
    o.dateCompleted=normDate(o.dateCompleted);
    return o;
  }).filter(r=>r.client||r.task);
}
// normalize วันที่ทุกรูปแบบ → YYYY-MM-DD (รองรับ M/D/YYYY จาก Google Sheets)
function normDate(v){
  if(!v) return '';
  v=v.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;           // YYYY-MM-DD อยู่แล้ว
  const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);   // M/D/YYYY (รูปแบบ Google)
  if(m){ const mo=m[1].padStart(2,'0'), d=m[2].padStart(2,'0'); return `${m[3]}-${mo}-${d}`; }
  return v;  // รูปแบบอื่น (เช่น Timeframe text) คงไว้
}
function splitCSVLine(line){
  const out=[];let cur='';let q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===','&&!q){out.push(cur);cur='';}
    else cur+=c;
  } out.push(cur); return out;
}

/* ═══ THEME BRIDGE ═══
   กราฟวาดด้วย inline style จึงต้องอ่านค่าสีจากโทเคนจริง ไม่ใช่ฝัง hex ไว้ในโค้ด
   (บทเรียนเดิม: var() ใน inline style ไม่ resolve → เคยฝัง hex ทำให้โหมดมืดตามไม่ได้) */
function cssv(name,fallback){
  try{ const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v||fallback; }
  catch(e){ return fallback; }
}
const THEME={
  get statusColors(){ return {
    'Not Started':cssv('--bar-status-idle','#5B7386'),
    'In Progress':cssv('--teal','#00A8B5'),
    'Waiting':cssv('--amber','#CF850A'),
    'Blocked':cssv('--purple','#7F77DD'),
    'Done':cssv('--green','#248A57')}; },
  get bar(){ return cssv('--bar-people','#0A2540'); },
  get ringGood(){ return '#1F9D5A'; },   // Client View = เอกสารสีสว่างเสมอ ไม่ผูกกับโหมดมืด
  get ringWatch(){ return '#D89311'; },
  get ringTrack(){ return '#E8EEF4'; }
};
// เครื่องสลับโหมดสว่าง/มืดระหว่างเปิดแอปอยู่ → วาดใหม่ให้สีตรง
try{
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme=()=>{ try{ render(); }catch(e){} };
  mq.addEventListener ? mq.addEventListener('change',onScheme) : mq.addListener(onScheme);
}catch(e){}


/* ═══════════════════════════════════════════════════════════
   [บล็อก 7] ชั้นเขียนกลับ — ทุกการแก้ไขวิ่งผ่านที่นี่ที่เดียว
   หลักการ: แสดงผลทันที → ส่งไปตรวจ → สำเร็จก็ยืนยัน ล้มเหลวก็ย้อนค่า
   ไม่มีทางที่หน้าจอจะบอกว่าบันทึกแล้วทั้งที่ชีตไม่ได้เปลี่ยน
   ═══════════════════════════════════════════════════════════ */
const EDITABLE_UI=['status','nextStep','deadline','clientView','remarks','rag','dateCompleted','owner','counterparty','priority','timeframe'];
const KEY2HEADER={status:'Status',nextStep:'Next Step',deadline:'Deadline',clientView:'Client-view',remarks:'Remarks',
  rag:'RAG',dateCompleted:'Date Completed',owner:'Owner',counterparty:'Counterparty',priority:'Priority',timeframe:'Timeframe',clientMessage:'Client-message'};
const STATUS_VALUES=['Not Started','In Progress','Waiting','Blocked','Done','Timeline'];

function canEdit(){ return STATE.me && STATE.me.role==='editor'; }
function rowByNum(n){ return STATE.rows.find(r=>r._row===n); }

/** บันทึกการแก้ไขของแถวเดียว — patch ใช้ key ของแอป เช่น {status:'Done'} */
async function saveRow(rowNum, patch, opts){
  opts=opts||{};
  if(!canEdit()){ toast('View-only access'); return false; }
  const r=rowByNum(rowNum); if(!r) return false;
  const fields={}, before={};
  for(const k in patch){
    if(EDITABLE_UI.indexOf(k)<0){ console.warn('field not editable:',k); continue; }
    fields[KEY2HEADER[k]]=patch[k]; before[k]=r[k];
  }
  if(!Object.keys(fields).length) return false;

  STATE.dirtyLock=true; STATE.saving[rowNum]=true;
  Object.assign(r,patch);            // แสดงผลทันที (optimistic)
  render(); setSync('Saving…','busy');
  try{
    const res=await api('updateRow',{row:rowNum, expectedTask:r.task, fields:fields});
    if(res && res.conflict){
      Object.assign(r,before); render();
      toast('Someone changed this row — refreshing');
      await loadData(true); return false;
    }
    if(!opts.noUndo) armUndo(rowNum,before,opts.label||'Change saved');
    else toast(opts.label||'Saved');
    setSync('Saved');
    return true;
  }catch(e){
    Object.assign(r,before); render();               // ย้อนค่า ไม่หลอกตา
    toast('Not saved: '+(e.message||'error'));
    setSync('⚠️ Not saved','bad');
    return false;
  }finally{ STATE.dirtyLock=false; delete STATE.saving[rowNum]; }
}

/** ปุ่มย้อนกลับ 30 วินาที */
function armUndo(rowNum,before,label){
  STATE.undo={row:rowNum,before:before,at:Date.now()};
  toast(label,{action:'Undo', onAction:async()=>{
    const u=STATE.undo; if(!u) return;
    STATE.undo=null;
    await saveRow(u.row,u.before,{noUndo:true,label:'Reverted'});
  }});
  setTimeout(()=>{ if(STATE.undo && Date.now()-STATE.undo.at>=29500) STATE.undo=null; },30000);
}

/* ---------- ปุ่มลัด ---------- */
const todayISO=()=>new Date().toISOString().slice(0,10);
function actDone(rowNum){
  // ปิดงาน = 3 ช่องในคลิกเดียว (เดิมต้องแก้ทีละช่อง คนลืมประจำ → เกิดเคส Done แต่ RAG ยังแดง)
  return saveRow(rowNum,{status:'Done',dateCompleted:todayISO(),rag:''},{label:'Task closed'});
}
async function actDoneNext(rowNum){
  const r=rowByNum(rowNum); if(!r) return;
  const nextTitle=(r.nextStep||'').trim();
  if(!nextTitle){ toast('No next step written on this task'); return; }
  openAddModal({client:r.client,deal:r.deal,division:r.division,subProject:r.subProject,
    owner:r.owner,task:nextTitle,priority:r.priority||'P2',
    _after:async()=>{ await actDone(rowNum); }, _title:'Close this task and open the next one'});
}
function actPostpone(rowNum){
  const r=rowByNum(rowNum); if(!r) return;
  openPostponeModal(r);
}
function actWaiting(rowNum){
  const r=rowByNum(rowNum); if(!r) return;
  const who=prompt('Waiting on whom? (client, bank, advisor…)', r.counterparty||'');
  if(who===null) return;
  if(!who.trim()){ toast('Name the external party'); return; }
  return saveRow(rowNum,{status:'Waiting',counterparty:who.trim()},{label:'Marked as waiting'});
}
function actLog(rowNum){
  const r=rowByNum(rowNum); if(!r) return;
  const note=prompt('Progress note (one line)');
  if(note===null||!note.trim()) return;
  const d=new Date(), stamp=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
  const who=(STATE.me.email||'').split('@')[0];
  const line='['+stamp+' '+who+'] '+note.trim();
  const merged=(r.remarks? r.remarks+' · ':'')+line;
  return saveRow(rowNum,{remarks:merged},{label:'Note added'});
}
function actDuplicate(rowNum){
  const r=rowByNum(rowNum); if(!r) return;
  openAddModal({client:r.client,deal:r.deal,division:r.division,subProject:r.subProject,
    owner:r.owner,task:r.task,priority:r.priority||'P2',timeframe:r.timeframe,
    _title:'Duplicate this task'});
}
function openRowInSheet(rowNum){
  if(!CONFIG.GUIDE_URL) return;
  window.open(CONFIG.GUIDE_URL+'&range=A'+rowNum,'_blank');
}
/** เพิ่มลงปฏิทินของเครื่อง — ไฟล์ .ics ไม่ต้องพึ่งระบบแจ้งเตือนของเราเอง */
function downloadIcs(rowNum){
  const r=rowByNum(rowNum); if(!r||!r.deadline) return;
  const d=r.deadline.replace(/-/g,'');
  const nx=new Date(r.deadline); nx.setDate(nx.getDate()+1);
  const de=nx.toISOString().slice(0,10).replace(/-/g,'');
  const esc2=t=>String(t||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Qanvas//Tracker//EN','BEGIN:VEVENT',
    'UID:qanvas-'+rowNum+'-'+d+'@qanvasadvisory.com','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+de,
    'SUMMARY:'+esc2(r.task),'DESCRIPTION:'+esc2([r.client,r.deal,r.nextStep].filter(Boolean).join(' · ')),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  a.download='Qanvas_'+(r.client||'task').replace(/[^\w-]/g,'')+'_'+r.deadline+'.ics';
  document.body.appendChild(a); a.click(); a.remove();
}


/* ═══ [บล็อก 8] ฟอร์ม: เพิ่มงาน / เลื่อนกำหนด ═══ */
function optList(vals,cur){ return vals.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)||'—'}</option>`).join(''); }
function uniqVals(key){ return [...new Set(STATE.rows.map(r=>r[key]).filter(v=>v&&v!=='—'))].sort(); }

function openAddModal(seed){
  seed=seed||{};
  if(!canEdit()){ toast('View-only access'); return; }
  const el=document.getElementById('formModal');
  const divisions=uniqVals('division'), clients=uniqVals('client'), owners=uniqVals('owner'), deals=uniqVals('deal');
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${esc(seed._title||'Add task')}</h3><button class="modal-close" id="fmClose" aria-label="Close">✕</button></div>
    <div class="fm-body">
      <label class="fm-l">Division<select id="fmDivision">${optList(divisions,seed.division||'')}</select></label>
      <label class="fm-l">Client<select id="fmClient">${optList(clients,seed.client||'')}</select></label>
      <label class="fm-l">Deal <span class="fm-hint">pick an existing one where possible</span>
        <input id="fmDeal" list="fmDealList" value="${esc(seed.deal||'')}" placeholder="—">
        <datalist id="fmDealList">${deals.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label>
      <label class="fm-l fm-wide">Task<textarea id="fmTask" rows="2" placeholder="What has to be done">${esc(seed.task||'')}</textarea></label>
      <label class="fm-l">Owner<select id="fmOwner">${optList(owners,seed.owner||'')}</select></label>
      <label class="fm-l">Priority<select id="fmPriority">${optList(['P1','P2','P3'],seed.priority||'P2')}</select></label>
      <label class="fm-l">Deadline<input type="date" id="fmDeadline" value="${esc(seed.deadline||'')}"></label>
      <label class="fm-l">Timeframe<select id="fmTimeframe">${optList(['','This Week','This Month','Ongoing','TBD'],seed.timeframe||'')}</select></label>
      <div class="fm-err" id="fmErr"></div>
    </div>
    <div class="modal-foot"><button class="btn-primary" id="fmSave">Save</button><button class="btn-ghost" id="fmCancel">Cancel</button></div>
  </div>`;
  el.classList.remove('hidden');
  const close=()=>el.classList.add('hidden');
  document.getElementById('fmClose').onclick=close;
  document.getElementById('fmCancel').onclick=close;
  el.onclick=e=>{ if(e.target.id==='formModal') close(); };
  document.getElementById('fmSave').onclick=async()=>{
    const g=id=>document.getElementById(id).value.trim();
    const err=document.getElementById('fmErr');
    if(!g('fmClient')){ err.textContent='Client is required'; return; }
    if(!g('fmTask')){ err.textContent='Task is required'; return; }
    if(!g('fmDeadline') && !g('fmTimeframe')){ err.textContent='Give a deadline or a timeframe'; return; }
    const btn=document.getElementById('fmSave'); btn.disabled=true; btn.textContent='Saving…';
    try{
      await api('addRow',{fields:{
        'Division':g('fmDivision'),'Client':g('fmClient'),'Deal':g('fmDeal'),'Task':g('fmTask'),
        'Owner':g('fmOwner'),'Priority':g('fmPriority'),'Deadline':g('fmDeadline'),'Timeframe':g('fmTimeframe'),
        'Status':'Not Started','RAG':'Green'}});
      close();
      if(seed._after) await seed._after();
      await loadData(true);
      toast('Task added');
    }catch(e){ err.textContent=e.message||'Could not save'; btn.disabled=false; btn.textContent='Save'; }
  };
  setTimeout(()=>{ const t=document.getElementById('fmTask'); if(t&&!seed.task) t.focus(); },50);
}

function openPostponeModal(r){
  const el=document.getElementById('formModal');
  const base=r.deadline||todayISO();
  const plus=n=>{ const d=new Date(base); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>Postpone</h3><button class="modal-close" id="pmClose" aria-label="Close">✕</button></div>
    <div class="fm-body">
      <div class="fm-task">${esc(r.task)}</div>
      <div class="fm-quick">
        <button class="btn-ghost" data-d="${plus(1)}">+1 day</button>
        <button class="btn-ghost" data-d="${plus(7)}">+1 week</button>
        <button class="btn-ghost" data-d="${plus(14)}">+2 weeks</button>
      </div>
      <label class="fm-l fm-wide">New deadline<input type="date" id="pmDate" value="${esc(plus(7))}"></label>
      <label class="fm-l fm-wide">Why <span class="fm-hint">saved to remarks, so the history is not lost</span>
        <input id="pmWhy" placeholder="Waiting on the auditor…"></label>
      <div class="fm-err" id="pmErr"></div>
    </div>
    <div class="modal-foot"><button class="btn-primary" id="pmSave">Save</button><button class="btn-ghost" id="pmCancel">Cancel</button></div>
  </div>`;
  el.classList.remove('hidden');
  const close=()=>el.classList.add('hidden');
  document.getElementById('pmClose').onclick=close; document.getElementById('pmCancel').onclick=close;
  el.onclick=e=>{ if(e.target.id==='formModal') close(); };
  el.querySelectorAll('.fm-quick button').forEach(b=>b.onclick=()=>{ document.getElementById('pmDate').value=b.dataset.d; });
  document.getElementById('pmSave').onclick=async()=>{
    const nd=document.getElementById('pmDate').value, why=document.getElementById('pmWhy').value.trim();
    if(!nd){ document.getElementById('pmErr').textContent='Pick a date'; return; }
    if(!why){ document.getElementById('pmErr').textContent='One line on why — it keeps the history honest'; return; }
    const d=new Date(), stamp=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
    const note='['+stamp+' postponed → '+nd+'] '+why;
    close();
    await saveRow(r._row,{deadline:nd, remarks:(r.remarks? r.remarks+' · ':'')+note},{label:'Deadline moved'});
  };
}

// ปุ่ม toggle 4 ตัว (Tasks + Clients) — label + สถานะ .off สะท้อน state
function syncToggleBtns(){
  // checkbox chip: ติ๊ก (.on) = แสดงอยู่ · ไม่ติ๊ก = ซ่อนอยู่ — ข้อความคงที่ ไม่สลับ
  const set=(btnId,hidden)=>{

  };
  set('toggleDone',STATE.hideDone);

}

// ---------- helpers ----------
const STATUS_ACTIVE = r => r.status!=='Done' && r.status!=='Dropped' && r.status!=='Timeline';
function fmtDate(iso){ if(!iso) return ''; const p=iso.split('-'); return p.length===3?`${p[2]}/${p[1]}`:iso; }
function isSoon(iso){ if(!iso) return false; const d=new Date(iso), today=new Date(CONFIG.TODAY); const diff=(d-today)/86400000; return diff<=3; }
function isOverdue(iso,status){ if(!iso||status==='Done'||status==='Dropped'||status==='Timeline') return false; const d=new Date(iso), today=new Date(CONFIG.TODAY); return d < today; }
function ragClass(r){ const m={Red:'rag-red',Amber:'rag-amber',Green:'rag-green'}; return m[r.rag]||'rag-none'; }
function statusClass(s){ return 'st-'+(s||'').toLowerCase().replace(/\s/g,''); }
function hasWarnBlankTime(r){ return !r.deadline && !r.timeframe && r.task; }

// ---------- filters ----------
function filteredRows(){
  const f=STATE.filters;
  return STATE.rows.filter(r=>{
    // ค่าเริ่มต้นแสดงทั้งหมด; ซ่อนเมื่อผู้ใช้กด Hide (เว้นแต่กรอง Status เจาะจง)
    if(STATE.hideDone && !f.status && (r.status==='Done'||r.status==='Dropped')) return false;
    if(STATE.hideTimeline && !f.status && r.status==='Timeline') return false;
    if(f.division && r.division!==f.division) return false;
    if(f.client && r.client!==f.client) return false;
    if(f.deal && r.deal!==f.deal) return false;
    if(f.status && r.status!==f.status) return false;
    if(f.owner && r.owner!==f.owner) return false;
    // ตัวกรองที่มาจากการคลิก Dashboard (ไม่มี dropdown) — ทำให้ตัวเลขบนการ์ดตรงกับจำนวนแถวเป๊ะ
    if(f.rag && r.rag!==f.rag) return false;
    if(f.verify && !isYes(r.verify)) return false;
    if(f.activeOnly && !STATUS_ACTIVE(r)) return false;
    if(f.search){ const q=f.search.toLowerCase(); const hay=(r.task+' '+r.remarks+' '+r.nextStep+' '+r.subProject).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}
function uniq(key){ return [...new Set(STATE.rows.map(r=>r[key]).filter(v=>v&&v!=='—'))].sort(); }

function buildFilters(){
  const f=STATE.filters;
  const set=(id,key,allLabel,opts)=>{
    const sel=document.getElementById(id);
    sel.innerHTML=`<option value="">${allLabel}</option>`+opts.map(o=>`<option value="${o}"${f[key]===o?' selected':''}>${o}</option>`).join('');
    sel.parentElement.classList.toggle('active',!!f[key]);
  };
  set('fDivision','division',t('all_div'),uniq('division'));
  set('fClient','client',t('all_client'),uniq('client'));
  // cascading: Deal shows only for selected client
  let deals = STATE.rows.filter(r=>!f.client||r.client===f.client).map(r=>r.deal).filter(v=>v&&v!=='—');
  set('fDeal','deal',t('all_deal'),[...new Set(deals)].sort());
  // Status ดึงจากข้อมูลจริงในชีต เรียงตามลำดับงาน — dropdown ชีตเปลี่ยน แอปตามเอง
  const ORDER=['Not Started','In Progress','Waiting','Blocked','Done','Timeline'];
  const found=[...new Set(STATE.rows.map(r=>r.status).filter(Boolean))];
  const statusOpts=[...ORDER.filter(s=>found.includes(s)),...found.filter(s=>!ORDER.includes(s)).sort()];
  set('fStatus','status',t('all_status'),statusOpts);
  set('fOwner','owner',t('all_owner'),uniq('owner'));
}
function buildChips(){
  const f=STATE.filters; const el=document.getElementById('chips'); const parts=[];
  const add=(key,label)=>{ if(f[key]) parts.push(`<span class="chip">${label}: ${f[key]}<button data-clear="${key}">×</button></span>`); };
  add('division','Division');add('client','Client');add('deal','Deal');add('status','Status');add('owner','Owner');
  add('rag','Risk');
  if(f.verify) parts.push(`<span class="chip">Needs verifying<button data-clear="verify">×</button></span>`);
  if(f.activeOnly) parts.push(`<span class="chip">Active only<button data-clear="activeOnly">×</button></span>`);
  if(f.search) parts.push(`<span class="chip">"${f.search}"<button data-clear="search">×</button></span>`);
  if(parts.length) parts.push(`<span class="chip chip-clear"><button data-clear="all">${t('clear_all')}</button></span>`);
  el.innerHTML=parts.join('');
  el.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.clear;
    if(k==='all') STATE.filters={division:'',client:'',deal:'',status:'',owner:'',search:'',rag:'',verify:'',activeOnly:false};
    else if(k==='activeOnly') STATE.filters.activeOnly=false;
    else { STATE.filters[k]=''; if(k==='client') STATE.filters.deal=''; }
    document.getElementById('fSearch').value=STATE.filters.search;
    render();
  });
}

// ---------- drill-down: คลิกตัวเลข/แท่งกราฟ → เปิดหน้า Tasks ที่กรองไว้แล้ว ----------
function goPage(page){
  STATE.page=page;
  document.querySelectorAll('.tab[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  const el=document.getElementById('page-'+page); if(el) el.classList.remove('hidden');
}
function goTasksRow(rowNum){
  const r=rowByNum(rowNum); if(!r) return;
  STATE.expanded[r._row]=true;                       // กางแถวนั้นรอไว้ จะได้แก้ต่อได้ทันที
  goTasks({client:r.client, deal:(r.deal&&r.deal!=='—')?r.deal:''});
}
function goTasks(patch){
  // เริ่มจากล้างตัวกรองเดิมเสมอ เพื่อไม่ให้ค้างจากการคลิกครั้งก่อน
  STATE.filters={division:'',client:'',deal:'',status:'',owner:'',search:'',rag:'',verify:'',activeOnly:false};
  Object.assign(STATE.filters,patch);
  const sf=document.getElementById('fSearch'); if(sf) sf.value='';
  // ⚠️ กับดัก: ถ้าผู้ใช้ปิดการแสดง Done/Timeline ไว้ การเด้งมาจะเห็น 0 แถว
  //    ทั้งที่เพิ่งเห็นตัวเลขบนการ์ด → เปิดให้เห็นตามสิ่งที่คลิกเสมอ
  if(patch.status==='Done'||patch.status==='Dropped') STATE.hideDone=false;
  if(patch.status==='Timeline') STATE.hideTimeline=false;
  if(!patch.activeOnly && !patch.status){ STATE.hideDone=false; STATE.hideTimeline=false; }
  syncToggleBtns();
  STATE.view='table';
  document.getElementById('viewTable').classList.add('on');
  document.getElementById('viewCards').classList.remove('on');
  goPage('table');
  render();
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}
// ผูก handler ให้ทุกอย่างที่มี data-drill (การ์ด + แท่งกราฟ) — กดด้วยเมาส์หรือ Enter ก็ได้
function bindDrill(root){
  root.querySelectorAll('[data-drill]').forEach(el=>{
    const patch=JSON.parse(el.dataset.drill);
    el.setAttribute('role','button'); el.setAttribute('tabindex','0');
    el.onclick=()=>goTasks(patch);
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goTasks(patch); } };
  });
}

// ---------- sort: RAG red first → deadline → priority ----------
const RAG_ORD={Red:0,Amber:1,Green:2,'':3};
const PRI_ORD={P1:0,P2:1,P3:2,'':3};
function sortRows(rows){
  return rows.slice().sort((a,b)=>{
    if(RAG_ORD[a.rag]!==RAG_ORD[b.rag]) return RAG_ORD[a.rag]-RAG_ORD[b.rag];
    const ad=a.deadline||'9999', bd=b.deadline||'9999';
    if(ad!==bd) return ad<bd?-1:1;
    return (PRI_ORD[a.priority]||3)-(PRI_ORD[b.priority]||3);
  });
}

// ---------- render: TABLE (grouped by Client › Deal) ----------
function renderTable(){
  const rows=sortRows(filteredRows());
  const wrap=document.getElementById('tableView');
  if(!rows.length){ wrap.innerHTML=`<div class="empty-note">${t('no_tasks')}</div>`; return; }
  // group by client › deal
  const groups={};
  rows.forEach(r=>{ const key=r.client+' › '+(r.deal&&r.deal!=='—'?r.deal:'—'); (groups[key]=groups[key]||[]).push(r); });
  let html=`<table><thead><tr><th>${t('col_rag')}</th><th>${t('col_task')}</th><th>${t('col_sub')}</th><th>${t('col_pri')}</th><th>${t('col_status')}</th><th>${t('col_owner')}</th><th>${t('col_deadline')}</th></tr></thead><tbody>`;
  Object.keys(groups).forEach(gk=>{
    const collapsed=STATE.collapsed[gk];
    const gClient=gk.split(' › ')[0];
    html+=`<tr class="grp-row${collapsed?' collapsed':''}" data-grp="${gk.replace(/"/g,'')}"><td colspan="7"><span class="grp-caret">▾</span>${gk}<span class="grp-count">${groups[gk].length} ${t('unit_task')}</span><button class="grp-jump" data-client="${esc(gClient)}" title="Open this client's timeline">Client →</button></td></tr>`;
    if(!collapsed) groups[gk].forEach((r,ri)=>{
      const warn=hasWarnBlankTime(r);
      const rk=gk+'#'+ri;
      const open=STATE.expanded[rk];
      const ns=(r.nextStep||'').trim();
      html+=`<tr class="task-row${open?' open':''}" data-row="${esc(rk)}" title="${t('row_hint')}">
        <td><span class="rag ${ragClass(r)}"><span class="rag-dot"></span>${r.rag||'—'}</span></td>
        <td class="task-cell"><span class="row-caret">▸</span>${esc(r.task)}</td>
        <td style="color:var(--ink2)">${esc(r.subProject)||'—'}</td>
        <td><span class="pri pri-${r.priority}">${r.priority}</span></td>
        <td><span class="pill ${statusClass(r.status)}">${r.status}</span></td>
        <td>${esc(r.owner)}</td>
        <td class="${warn?'warn-cell':''}">${r.deadline?`<span class="dl ${isOverdue(r.deadline,r.status)?'dl-soon':''}">${fmtDate(r.deadline)}</span>`:(r.timeframe?`<span class="tf-tag">${r.timeframe}</span>`:'<span style="color:var(--amber);font-weight:600">⚠ No date</span>')}</td>
      </tr>`;
      if(open) html+=`<tr class="detail-row"><td colspan="7">${detailPanel(r,ns)}</td></tr>`;
    });
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('.grp-row').forEach(gr=>gr.onclick=()=>{ const k=gr.dataset.grp; STATE.collapsed[k]=!STATE.collapsed[k]; renderTable(); });
  // ปุ่ม Client → ต้องไม่ไปสั่งพับกลุ่ม (กันคลิกทะลุ)
  wrap.querySelectorAll('.grp-jump').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    STATE.custClient=b.dataset.client; goPage('customer'); render();
    try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(err){ window.scrollTo(0,0); }
  });
  wrap.querySelectorAll('.task-row').forEach(tr=>tr.onclick=()=>{ const k=tr.dataset.row; STATE.expanded[k]=!STATE.expanded[k]; renderTable(); });
  bindDetail(wrap);
}

function bindDetail(root){
  root.querySelectorAll('.detail-wrap').forEach(w=>{
    const rowNum=parseInt(w.dataset.row,10);
    w.onclick=e=>e.stopPropagation();          // คลิกในแผงต้องไม่ไปสั่งหุบแถว
    w.querySelectorAll('.d-in').forEach(inp=>{
      const f=inp.dataset.f;
      inp.onchange=()=>{
        const patch={}; patch[f]=inp.value;
        // ปิดงานจากช่อง Status ให้ผลเหมือนกดปุ่ม Close task (กันเคส Done แต่ RAG ยังแดง)
        if(f==='status'&&inp.value==='Done'){ patch.dateCompleted=todayISO(); patch.rag=''; }
        if(f==='status'&&inp.value==='Timeline'){ patch.owner=''; }
        saveRow(rowNum,patch);
      };
    });
    const chk=w.querySelector('input[type=checkbox][data-f="clientView"]');
    if(chk) chk.onchange=()=>saveRow(rowNum,{clientView:chk.checked?'TRUE':'FALSE'});
    w.querySelectorAll('.d-act').forEach(b=>b.onclick=()=>{
      const a=b.dataset.act;
      if(a==='done') actDone(rowNum);
      else if(a==='donenext') actDoneNext(rowNum);
      else if(a==='postpone') actPostpone(rowNum);
      else if(a==='waiting') actWaiting(rowNum);
      else if(a==='log') actLog(rowNum);
      else if(a==='dup') actDuplicate(rowNum);
      else if(a==='sheet') openRowInSheet(rowNum);
      else if(a==='ics') downloadIcs(rowNum);
    });
  });
}

// ---------- render: DASHBOARD ----------
function renderDashboard(){
  const rows=STATE.rows;
  const active=rows.filter(STATUS_ACTIVE);
  const cnt=(fn)=>rows.filter(fn).length;
  const focus=[
    {c:'red',n:cnt(r=>r.rag==='Red'&&STATUS_ACTIVE(r)),l:t('focus_risk'),d:{rag:'Red',activeOnly:true}},
    {c:'amber',n:cnt(r=>r.status==='Waiting'),l:t('focus_wait'),d:{status:'Waiting'}},
    {c:'purple',n:cnt(r=>r.status==='Blocked'),l:t('focus_block'),d:{status:'Blocked'}},
    {c:'teal',n:cnt(r=>isYes(r.verify)&&STATUS_ACTIVE(r)),l:t('focus_verify'),d:{verify:'Yes',activeOnly:true}}
  ];
  document.getElementById('focusGrid').innerHTML=focus.map(f=>`<div class="focus-card drill ${f.c}" data-drill='${JSON.stringify(f.d)}' title="Open these tasks"><div class="focus-n">${f.n}</div><div class="focus-l">${f.l}</div></div>`).join('');
  // status bars
  // เฉพาะสถานะที่เป็น "งานของทีม" — ไม่รวม Timeline (เหตุการณ์แจ้งให้ทราบ) และ Dropped (เลิกใช้แล้ว)
  const SCOL=THEME.statusColors;
  const statuses=[['Not Started',SCOL['Not Started']],['In Progress',SCOL['In Progress']],['Waiting',SCOL.Waiting],['Blocked',SCOL.Blocked],['Done',SCOL.Done]];
  const maxS=Math.max(...statuses.map(([s])=>cnt(r=>r.status===s)),1);
  document.getElementById('dashStatus').innerHTML=statuses.map(([s,c])=>{
    const n=cnt(r=>r.status===s); return `<div class="bar-row drill" data-drill='${JSON.stringify({status:s})}' title="Open these tasks"><span class="bar-label" title="${s}">${s}</span><span class="bar-track"><span class="bar-fill" style="width:${n/maxS*100}%;background:${c}"></span></span><span class="bar-n">${n}</span></div>`;
  }).join('');
  // people
  const people=[...new Set(active.map(r=>r.owner).filter(Boolean))];
  const pcount=people.map(p=>[p,active.filter(r=>r.owner===p).length]).sort((a,b)=>b[1]-a[1]);
  const maxP=Math.max(...pcount.map(x=>x[1]),1);
  document.getElementById('dashPeople').innerHTML=pcount.length
    ? pcount.map(([p,n])=>`<div class="bar-row drill" data-drill='${JSON.stringify({owner:p,activeOnly:true})}' title="Open these tasks"><span class="bar-label" title="${esc(p)}">${esc(p)}</span><span class="bar-track"><span class="bar-fill" style="width:${n/maxP*100}%;background:${THEME.bar}"></span></span><span class="bar-n">${n}</span></div>`).join('')
    : `<div class="bar-empty">No active tasks</div>`
    ;
  // division — ดึงชื่อจากข้อมูลจริงในชีต (ไม่ฟิกไว้ ถ้า dropdown ในชีตเปลี่ยน แอปเปลี่ยนตาม)
  const divs=[...new Set(active.map(r=>r.division).filter(Boolean))];
  const dcount=divs.map(d=>[d,active.filter(r=>r.division===d).length]).sort((a,b)=>b[1]-a[1]);
  const maxD=Math.max(...dcount.map(x=>x[1]),1);
  document.getElementById('dashDivision').innerHTML=dcount.length
    ? dcount.map(([d,n])=>`<div class="bar-row drill" data-drill='${JSON.stringify({division:d,activeOnly:true})}' title="Open these tasks"><span class="bar-label" title="${esc(d)}">${esc(d)}</span><span class="bar-track"><span class="bar-fill" style="width:${n/maxD*100}%;background:${THEME.bar}"></span></span><span class="bar-n">${n}</span></div>`).join('')
    : `<div class="bar-empty">No active tasks</div>`;
  bindDrill(document.getElementById('page-dashboard'));
}


/* ---------- render: THIS WEEK (จันทร์ = สแกนงานครบกำหนดสัปดาห์นี้ + ของแดง) ---------- */
function weekBounds(){
  const d=new Date(CONFIG.TODAY);
  const dow=(d.getDay()+6)%7;                 // จันทร์ = 0
  const mon=new Date(d); mon.setDate(d.getDate()-dow);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return [mon.toISOString().slice(0,10), sun.toISOString().slice(0,10)];
}
function weekCard(r,tagHtml){
  const late=isOverdue(r.deadline,r.status);
  return `<div class="wk-row" data-row="${r._row}">
    <span class="wk-d${late?' late':''}">${r.deadline?fmtDate(r.deadline):(r.timeframe||'—')}</span>
    <span class="wk-t">${esc(r.task)}<span class="wk-m">${esc(r.client)}${r.deal&&r.deal!=='—'?' › '+esc(r.deal):''}${r.owner?' · '+esc(r.owner):''}</span></span>
    <span class="wk-s">${tagHtml||`<span class="pill ${statusClass(r.status)}">${esc(r.status)}</span>`}</span>
    <span class="wk-b">${canEdit()?`<button class="d-btn" data-wk="done">Close</button><button class="d-btn" data-wk="postpone">Postpone</button>`:''}<button class="d-btn" data-wk="open">Open</button></span>
  </div>`;
}
function renderWeek(){
  const [mon,sun]=weekBounds();
  const el=document.getElementById('weekBody');
  const fmt=iso=>{const d=new Date(iso);return d.getDate()+' '+MONTHS_EN[d.getMonth()];};
  document.getElementById('weekRange').textContent=fmt(mon)+' – '+fmt(sun)+' · what needs a decision this week';

  // แต่ละงานต้องอยู่กลุ่มเดียวเท่านั้น ไม่งั้นนับซ้ำและคนไล่งานสองรอบ
  const open=STATE.rows.filter(STATUS_ACTIVE);
  const used=new Set();
  const take=(arr)=>{ const out=arr.filter(r=>!used.has(r._row)); out.forEach(r=>used.add(r._row)); return out; };
  const byDate=(a,b)=>a.deadline<b.deadline?-1:1;
  const late=take(open.filter(r=>isOverdue(r.deadline,r.status)).sort(byDate));
  const due=take(open.filter(r=>r.deadline>=mon&&r.deadline<=sun).sort(byDate));
  const red=take(open.filter(r=>r.rag==='Red'));
  const wait=take(open.filter(r=>r.status==='Waiting'));
  const undated=take(open.filter(r=>!r.deadline&&!r.timeframe));

  const block=(title,rows,note,tag)=>rows.length?`<div class="wk-block"><div class="wk-h">${title}<span class="wk-n">${rows.length}</span></div>`+
      (note?`<div class="wk-note">${note}</div>`:'')+rows.map(r=>weekCard(r,tag)).join('')+`</div>`:'';

  const html=
    block('Past the deadline',late,'Decide today: close it, or move it with a reason.')+
    block('Due this week',due)+
    block('Flagged red',red,'Open risks that are not tied to this week’s dates.')+
    block('Waiting on someone outside',wait,'Nothing moves until they answer — chase or change the plan.')+
    block('No date at all',undated,'Give each one a deadline or a timeframe, or it will drift.');

  el.innerHTML=html||`<div class="empty-note">Nothing needs a decision this week.</div>`;
  el.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{
    const n=parseInt(b.closest('.wk-row').dataset.row,10);
    const a=b.dataset.wk;
    if(a==='done') actDone(n);
    else if(a==='postpone') actPostpone(n);
    else goTasksRow(n);
  });
}
