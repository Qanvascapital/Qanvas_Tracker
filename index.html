function calEvents(iso){
  if(STATE.calMineOnly && STATE.me && STATE.me.email){
    const me=(STATE.me.name||STATE.me.email.split('@')[0]||'').toLowerCase();
    const all=calEventsAll(iso);
    return all.filter(r=>(r.owner||'').toLowerCase().includes(me)||!r.owner);
  }
  return calEventsAll(iso);
}
function calEventsAll(iso){
  // ปฏิทินแสดงทุกงานที่มีวันที่ — ไม่ผูกกับปุ่มของหน้า Tasks (ปฏิทินต้องเห็นครบเสมอ)
  return STATE.rows.filter(r=>r.deadline===iso);
}
function renderCalendar(){
  const y=STATE.calYear,m=STATE.calMonth;
  document.getElementById('calTitle').textContent=MONTHS_EN[m]+' '+y;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const dows=['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) html+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=calEvents(iso);
    const isToday=iso===CONFIG.TODAY;
    const cls=['cal-cell',isToday?'today':'',evs.length?'has-ev':'',iso===STATE.calSelDate?'sel':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}" data-date="${iso}"><div class="cal-date">${d}</div>`+
      evs.map(r=>{ const isMeet=/ประชุม|meeting/i.test(r.task); const ec=r.rag==='Red'?'red':(isMeet?'meeting':''); return `<div class="cal-ev ${ec}" title="${esc(r.task)}">${esc(r.task).slice(0,18)}</div>`; }).join('')+'</div>';
  }
  const grid=document.getElementById('calGrid');
  grid.innerHTML=html;
  // ทุกวันคลิกได้ รวมวันที่ยังว่าง — จะได้ลงนัดล่วงหน้าในวันที่ยังไม่มีอะไรเลย
  grid.querySelectorAll('.cal-cell:not(.empty)').forEach(c=>c.onclick=()=>{ STATE.calSelDate=(STATE.calSelDate===c.dataset.date?'':c.dataset.date); renderCalendar(); });
  renderCalDetail();
}
function renderCalDetail(){
  const hint=document.getElementById('calHint'), box=document.getElementById('calDetail');
  const iso=STATE.calSelDate;
  if(!iso){ box.classList.add('hidden'); box.innerHTML=''; hint.textContent=t('cal_hint'); return; }
  const evs=calEvents(iso);
  hint.textContent='';
  const dt=new Date(iso), dstr=`${dt.getDate()} ${MONTHS_EN[dt.getMonth()]} ${dt.getFullYear()}`;
  let h=`<div class="cal-detail-head"><span class="cal-detail-date">${dstr}</span><div style="display:flex;gap:8px;align-items:center">`+
    (canEdit()?`<button class="mini-drill" id="calAdd">+ Add on this date</button>`:'')+
    `<button class="cal-detail-close" id="calDetailClose" aria-label="${t('cal_close')}">✕</button></div></div>`;

  if(!evs.length){
    h+=`<div class="cal-empty">Nothing booked on this day.${canEdit()?' Use <b>+ Add on this date</b> to put something here.':''}</div>`;
  }
  evs.forEach(r=>{
    const openRow=!!STATE.expanded['cal'+r._row];
    const rows=[];
    if(r.client) rows.push([t('cal_client'),esc(r.client)]);
    if(r.deal&&r.deal!=='—') rows.push([t('cal_deal'),esc(r.deal)]);
    if(r.owner) rows.push([t('cal_owner'),esc(r.owner)]);
    rows.push([t('cal_status'),`<span class="pill ${statusClass(r.status)}">${esc(r.status)}</span>`]);
    h+=`<div class="cal-task${openRow?' open':''}">
      <div class="cal-task-t cal-toggle" data-row="${r._row}"><span class="cal-caret">▸</span>${esc(r.task)}</div>
      <div class="cal-kv">`+rows.map(kv=>`<span class="k">${kv[0]}</span><span class="v">${kv[1]}</span>`).join('')+`</div>`+
      (openRow ? detailPanel(r, r.nextStep)
               : `<button class="mini-drill cal-more" data-row="${r._row}">${canEdit()?'Update this ▾':'Details ▾'}</button>`)+
    `</div>`;
  });
  box.innerHTML=h;
  box.classList.remove('hidden');
  document.getElementById('calDetailClose').onclick=()=>{ STATE.calSelDate=''; renderCalendar(); };
  // กางแผงแก้ไขในที่เดียวกัน ไม่ต้องเด้งไปหน้าอื่นแล้วค่อยหาแถวเอง
  box.querySelectorAll('.cal-toggle,.cal-more').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const k='cal'+el.dataset.row;
    STATE.expanded[k]=!STATE.expanded[k];
    renderCalDetail();
  });
  bindDetail(box);
  bindDrill(box);
  const ca=document.getElementById('calAdd');
  if(ca) ca.onclick=()=>openAddModal({deadline:iso, task:'Meeting — ', _title:'Add on '+dstr});
}

// ---------- render: CUSTOMER TIMELINE ----------
function renderCustomer(){
  const clients=[...new Set(STATE.rows.map(r=>r.client).filter(Boolean))].sort();
  if(!STATE.custClient) STATE.custClient=clients[0]||'';
  const sel=document.getElementById('custSelect');
  sel.innerHTML=clients.map(c=>`<option value="${c}"${c===STATE.custClient?' selected':''}>${c}</option>`).join('');
  const allRows=STATE.rows.filter(r=>r.client===STATE.custClient);
  syncToggleBtns();
  let rows=allRows;
  if(STATE.custHideDone) rows=rows.filter(r=>r.status!=='Done'&&r.status!=='Dropped');
  if(STATE.custHideTimeline) rows=rows.filter(r=>r.status!=='Timeline');
  const deals={};
  rows.forEach(r=>{ const d=r.deal&&r.deal!=='—'?r.deal:t('no_deal'); (deals[d]=deals[d]||[]).push(r); });
  let html='';
  if(!rows.length){
    html+=`<div class="tl-empty">${t('cust_all_done')}</div>`;
  }
  Object.keys(deals).forEach(d=>{
    html+=`<div class="deal-block"><div class="deal-title"><span class="dot"></span>${d}</div>`;
    sortRows(deals[d]).forEach(r=>{
      const cls=(r.rag||'').toLowerCase();
      const when=r.deadline?fmtDate(r.deadline):(r.timeframe||'—');
      const ns=(r.nextStep||'').trim();
      const nextHtml=ns?`<div class="tl-next"><b>${t('tl_next')}</b> ${esc(ns)}</div>`:`<div class="tl-next empty"><b>${t('tl_next')}</b> –</div>`;
      html+=`<div class="tl-item ${cls}"><span class="tl-date">${when}</span><span class="tl-mid"><div class="tl-task">${esc(r.task)}</div>${nextHtml}</span><span class="pill ${statusClass(r.status)}">${r.status}</span></div>`;
    });
    html+='</div>';
  });
  const active=allRows.filter(STATUS_ACTIVE);
  const urgent=allRows.filter(r=>r.rag==='Red'&&STATUS_ACTIVE(r)).length;
  const waiting=allRows.filter(r=>r.status==='Waiting').length;
  const dealAll={};
  allRows.forEach(r=>{ const d=r.deal&&r.deal!=='—'?r.deal:t('no_deal'); dealAll[d]=(dealAll[d]||0)+1; });
  html+=`<div class="tl-summary">
    <div class="tl-sum-t">${STATE.custClient} — ${active.length} ${t('open_tasks')} · ${t('urgent')} ${urgent} · ${t('waiting_ext')} ${waiting}</div>
    <div class="tl-sum-s">${Object.keys(dealAll).map(d=>d+' '+dealAll[d]).join(', ')}</div>
    <button class="btn-primary" id="custCopyBtn">${t('cust_copy')}</button>
  </div>`;
  document.getElementById('custTimeline').innerHTML=html;
  document.getElementById('custCopyBtn').onclick=()=>copyText(buildCustomerSummary());
}

function isYes(v){ if(!v) return false; const s=String(v).trim().toLowerCase(); return s==='yes'||s==='true'||s==='✓'||s==='y'||s==='1'; }
function renderClientView(){
  // เฉพาะงานที่ Client-view = YES
  const cvRows=STATE.rows.filter(r=>isYes(r.clientView));
  const clients=[...new Set(cvRows.map(r=>r.client).filter(Boolean))];
  const sel=document.getElementById('cvSelect');
  if(!clients.length){
    sel.innerHTML='';
    document.getElementById('cvReport').innerHTML=`<div class="cv-empty">No items selected for client view yet<br><span style="font-size:12px">Tick Client-view = YES in the sheet to display items here</span></div>`;
    return;
  }
  if(!STATE.cvClient||!clients.includes(STATE.cvClient)) STATE.cvClient=clients[0];
  sel.innerHTML=clients.map(c=>`<option value="${esc(c)}"${c===STATE.cvClient?' selected':''}>${esc(c)}</option>`).join('');
  sel.onchange=e=>{ STATE.cvClient=e.target.value; renderClientView(); };

  const rows=cvRows.filter(r=>r.client===STATE.cvClient);
  // จัดกลุ่มตามดีล
  const deals={};
  rows.forEach(r=>{ const d=r.deal||'General'; (deals[d]=deals[d]||[]).push(r); });

  // สรุปรวม
  const isDone=r=>r.status==='Done';
  const isProg=r=>r.status==='In Progress';
  const isWait=r=>r.status==='Waiting';
  const nDone=rows.filter(isDone).length, nProg=rows.filter(isProg).length, nWait=rows.filter(isWait).length;
  const overall=rows.length?Math.round(nDone/rows.length*100):0;
  const today=new Date(CONFIG.TODAY);
  const dateStr=today.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  const dealPct=list=>{ if(!list.length) return 0; return Math.round(list.filter(isDone).length/list.length*100); };

    const list=deals[d];

    const tagCls=st==='a'?'a':'g', tagTxt=st==='a'?'At Risk':'On Track';
    let acts='';
    // แสดงเฉพาะงานที่ไม่ใช่ Waiting (Waiting ไปกล่องล่าง) เรียง Done ก่อน
    const shown=list.filter(r=>!isWait(r)).sort((a,b)=>{const o={'Done':0,'In Progress':1};return (o[a.status]??2)-(o[b.status]??2);});

      acts+=`<div class="cv-act"><div class="cv-aic ${ic}"></div><div><div class="cv-atext">${esc(msg)}</div><div class="cv-astat ${sc}">${scT}</div></div></div>`;
    });
    dealsHtml+=`<div class="cv-deal"><div class="cv-dhead"><div class="cv-dtitle"><div class="ac"></div><div class="dn">${esc(d)}</div></div><div class="cv-dstatus"><div class="cv-ring" style="background:conic-gradient(${ringColor} 0% ${pct}%,${THEME.ringTrack} ${pct}%)"><i>${pct}%</i></div><span class="cv-tag ${tagCls}">${tagTxt}</span></div></div>${acts}</div>`;
  });

  // กล่อง Awaiting (งาน Waiting)

// ---------- summaries (copy text) ----------
function inRange(iso,range){
  if(!iso) return false;
  const d=new Date(iso), today=new Date(CONFIG.TODAY);
  if(range==='week'){ const diff=(d-today)/86400000; return diff>=-7&&diff<=7; }
  if(range==='month'){ return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear(); }
  if(range==='nextmonth'){ const nm=new Date(today.getFullYear(),today.getMonth()+1,1); return d.getMonth()===nm.getMonth()&&d.getFullYear()===nm.getFullYear(); }
  return false;
}
function buildSummary(range){
  const rows=STATE.rows.filter(r=>inRange(r.deadline,range)&&STATUS_ACTIVE(r));
  const label={week:t('sum_week'),month:t('sum_month'),nextmonth:t('sum_nextmonth')}[range];
  if(!rows.length) return `📋 ${t('sum_head')} (${label}) — ${t('no_tasks')}`;
  const sorted=sortRows(rows);
  const risk=sorted.filter(r=>r.rag==='Red');
  const isMeet=r=>/ประชุม|meeting/i.test(r.task);
  const meet=sorted.filter(isMeet);
  const other=sorted.filter(r=>r.rag!=='Red'&&!isMeet(r));
  let s=`📋 ${t('sum_head')} — Qanvas (${label})\n`;
  if(risk.length){ s+=`\n🔴 ${t('focus_risk')}\n`; risk.forEach(r=>s+=`• ${r.task} — ${fmtDate(r.deadline)} (${r.owner})\n`); }
  if(meet.length){ s+=`\n📅 Meetings\n`; meet.forEach(r=>s+=`• ${r.task} — ${fmtDate(r.deadline)}\n`); }
  if(other.length){ s+=`\n📌 Other tasks\n`; other.forEach(r=>s+=`• ${r.task} — ${fmtDate(r.deadline)} (${r.owner})\n`); }
  s+=`\nTotal ${rows.length} tasks`;
  return s;
}
function buildCustomerSummary(){
  const rows=STATE.rows.filter(r=>r.client===STATE.custClient&&STATUS_ACTIVE(r));
  let s=`📋 ${STATE.custClient} — summary\n`;
  const deals={}; rows.forEach(r=>{const d=r.deal&&r.deal!=='—'?r.deal:'—';(deals[d]=deals[d]||[]).push(r);});
  Object.keys(deals).forEach(d=>{ s+=`\n● ${d}\n`; sortRows(deals[d]).forEach(r=>{ const w=r.deadline?fmtDate(r.deadline):(r.timeframe||'—'); s+=`• ${r.task} — ${r.status} (${w})\n`; }); });
  return s;
}
function openSummary(){ STATE.sumRange='week'; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.range==='week')); document.getElementById('summaryText').textContent=buildSummary('week'); document.getElementById('summaryModal').classList.remove('hidden'); }
function copyText(txt){ navigator.clipboard.writeText(txt).then(()=>toast(t('copied'))); }
function toast(msg,opts){
  opts=opts||{};
  document.querySelectorAll('.qv-toast').forEach(t=>t.remove());
  const el=document.createElement('div'); el.className='qv-toast';
  el.innerHTML='<span></span>'+(opts.action?'<button class="qv-toast-a"></button>':'');
  el.querySelector('span').textContent=msg;
  if(opts.action){ const b=el.querySelector('.qv-toast-a'); b.textContent=opts.action; b.onclick=()=>{ el.remove(); opts.onAction&&opts.onAction(); }; }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), opts.action?30000:2600);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- render dispatcher ----------
function render(){
  applyI18n();
  buildFilters(); buildChips();
  if(STATE.page==='table'){ if(STATE.view==='table'){renderTable();document.getElementById('tableView').classList.remove('hidden');document.getElementById('cardsView').classList.add('hidden');} else {renderCards();document.getElementById('cardsView').classList.remove('hidden');document.getElementById('tableView').classList.add('hidden');} }
  renderOverdue();
  if(STATE.page==='week') renderWeek();
  if(STATE.page==='dashboard') renderDashboard();
  if(STATE.page==='calendar') renderCalendar();
  if(STATE.page==='customer') renderCustomer();
  if(STATE.page==='clientview') renderClientView();
}

// ---------- events ----------
function bindEvents(){
  document.querySelectorAll('.tab[data-page]').forEach(tab=>tab.onclick=()=>{
    STATE.page=tab.dataset.page;
    document.querySelectorAll('.tab[data-page]').forEach(x=>x.classList.toggle('on',x===tab));
    document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
    document.getElementById('page-'+STATE.page).classList.remove('hidden');
    render();
  });
  // ปุ่ม Export รายงานลูกค้า
  function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)){res();return;} const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  async function captureDoc(){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const el=document.getElementById('cvDoc');
    return await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
  }
  const pngBtn=document.getElementById('cvExportPng');
  const pdfBtn=document.getElementById('cvExportPdf');
  if(pngBtn) pngBtn.onclick=async()=>{
    if(!document.getElementById('cvDoc')) return;
    pngBtn.textContent='...'; try{ const c=await captureDoc(); const a=document.createElement('a'); a.download='Qanvas_Report_'+(STATE.cvClient||'client')+'.png'; a.href=c.toDataURL('image/png'); a.click(); }catch(e){alert('Export failed: '+e.message);} pngBtn.textContent='Export PNG';
  };
  if(pdfBtn) pdfBtn.onclick=async()=>{
    if(!document.getElementById('cvDoc')) return;
    pdfBtn.textContent='...'; try{
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const c=await captureDoc(); const img=c.toDataURL('image/png');
      const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4');
      const w=210, h=c.height*w/c.width;
      pdf.addImage(img,'PNG',0,0,w,h,'','FAST');
      pdf.save('Qanvas_Report_'+(STATE.cvClient||'client')+'.pdf');
    }catch(e){alert('Export failed: '+e.message);} pdfBtn.textContent='Export PDF';
  };
  const fmap={fDivision:'division',fClient:'client',fDeal:'deal',fStatus:'status',fOwner:'owner'};
  Object.entries(fmap).forEach(([id,key])=>document.getElementById(id).onchange=e=>{ STATE.filters[key]=e.target.value; if(key==='client') STATE.filters.deal=''; render(); });
  document.getElementById('fSearch').oninput=e=>{ STATE.filters.search=e.target.value; render(); };
  document.getElementById('viewTable').onclick=()=>{STATE.view='table';document.getElementById('viewTable').classList.add('on');document.getElementById('viewCards').classList.remove('on');render();};
  document.getElementById('viewCards').onclick=()=>{STATE.view='cards';document.getElementById('viewCards').classList.add('on');document.getElementById('viewTable').classList.remove('on');render();};
  document.getElementById('toggleDone').onclick=()=>{ STATE.hideDone=!STATE.hideDone; syncToggleBtns(); render(); };
  document.getElementById('toggleTimeline').onclick=()=>{ STATE.hideTimeline=!STATE.hideTimeline; syncToggleBtns(); render(); };
  document.getElementById('btnSummary').onclick=openSummary;
  const ab=document.getElementById('btnAdd');
  if(ab) ab.onclick=()=>openAddModal({});
  document.getElementById('sumClose').onclick=()=>document.getElementById('summaryModal').classList.add('hidden');
  document.getElementById('helpBtn').onclick=()=>{ const h=HELP[STATE.lang]; document.getElementById('helpTitle').textContent=h.title; document.getElementById('helpBody').innerHTML=h.body; document.getElementById('helpModal').classList.remove('hidden'); };
  document.getElementById('helpClose').onclick=()=>document.getElementById('helpModal').classList.add('hidden');
  document.getElementById('helpModal').onclick=e=>{ if(e.target.id==='helpModal') e.currentTarget.classList.add('hidden'); };
  document.getElementById('summaryModal').onclick=e=>{ if(e.target.id==='summaryModal') e.currentTarget.classList.add('hidden'); };
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ STATE.sumRange=b.dataset.range; document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); document.getElementById('summaryText').textContent=buildSummary(b.dataset.range); });
  document.getElementById('btnCopy').onclick=()=>copyText(document.getElementById('summaryText').textContent);
  const cm=document.getElementById('calMine');
  if(cm) cm.onclick=()=>{ STATE.calMineOnly=!STATE.calMineOnly; cm.classList.toggle('on',STATE.calMineOnly); renderCalendar(); };
  document.getElementById('calPrev').onclick=()=>{ STATE.calMonth--; if(STATE.calMonth<0){STATE.calMonth=11;STATE.calYear--;} STATE.calSelDate=''; renderCalendar(); };
  document.getElementById('calNext').onclick=()=>{ STATE.calMonth++; if(STATE.calMonth>11){STATE.calMonth=0;STATE.calYear++;} STATE.calSelDate=''; renderCalendar(); };
  document.getElementById('custSelect').onchange=e=>{ STATE.custClient=e.target.value; renderCustomer(); };
  document.getElementById('custToggleDone').onclick=()=>{ STATE.custHideDone=!STATE.custHideDone; syncToggleBtns(); renderCustomer(); };
  document.getElementById('custToggleTimeline').onclick=()=>{ STATE.custHideTimeline=!STATE.custHideTimeline; syncToggleBtns(); renderCustomer(); };
  document.getElementById('guideLink').onclick=e=>{ e.preventDefault(); if(CONFIG.GUIDE_URL&&CONFIG.GUIDE_URL!=='#') window.open(CONFIG.GUIDE_URL,'_blank'); else toast('Set the sheet URL in CONFIG.GUIDE_URL'); };
}

// ---------- init ----------
/* ตรวจตัวเองตอนเปิด — กันเคสวางไฟล์เก่าทับไฟล์ใหม่แล้วฟีเจอร์หายเงียบ ๆ */
function selfCheck(){
  const need={
    'row expand':()=>'expanded' in STATE,
    'drill-down':()=>typeof goTasks==='function',
    'theme bridge':()=>typeof cssv==='function',
    'checkbox toggles':()=>!!document.querySelector('.tgl-box'),
    'verify counter':()=>typeof isYes==='function',
    'brand logo':()=>!!document.querySelector('img.logo'),
    'html escaping':()=>typeof esc==='function',
    'write layer':()=>typeof saveRow==='function',
    'add form':()=>typeof openAddModal==='function',
    'undo':()=>typeof armUndo==='function',
    'overdue box':()=>!!document.getElementById('overdueBox'),
    'week page':()=>typeof renderWeek==='function',
    'calendar editing':()=>typeof goTasksRow==='function'
  };
  const missing=Object.keys(need).filter(k=>{ try{ return !need[k](); }catch(e){ return true; } });
  const el=document.getElementById('appVer'); if(el) el.textContent=APP_VERSION;
  if(missing.length){
    console.warn('[Qanvas Tracker] missing features:',missing);
    if(el){ el.textContent=APP_VERSION+' ⚠'; el.title='Missing: '+missing.join(', '); }
  }else{ console.log('[Qanvas Tracker]',APP_VERSION,'· self-check passed'); }
}
bindEvents();
selfCheck();
loadData();
if(HAS_API) setInterval(()=>{ if(!STATE.dirtyLock) loadData(true); }, CONFIG.POLL_SECONDS*1000);
</script>
